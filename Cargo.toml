[workspace]
resolver = "2"
members = ["crates/world-core", "crates/ternary", "crates/pipeline", "crates/mesh-node", "crates/mesh-relay"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.6.2"
authors = ["the constellation <cabotage@pm.me>"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
