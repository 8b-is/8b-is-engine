[workspace]
resolver = "2"
members = ["crates/world-core", "crates/ternary", "crates/qdecorators", "crates/corelib", "crates/pipeline", "crates/mesh-node", "crates/mesh-relay"]
exclude = ["enthea", "entheai", "music.vaked.dev", "tools", "client", "docs", "scripts"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.9.0"
authors = ["the constellation <cabotage@pm.me>"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
