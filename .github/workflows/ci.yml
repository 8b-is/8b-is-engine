# ci.yml — the oneshot verify: scaffold + workspace tests + the floors.
# Runs on every push and on demand (workflow_dispatch): proves the E2E lane
# — ./scaffold.sh verify, cargo test --workspace (36+ tests, none need a
# running nats-server — the mesh-node tests use raw TCP), and the 25-floor
# smoke harness — on Linux, the engine's second home.

name: ci-oneshot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: install the toolchain (uv, node 22, cargo, git-lfs)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo apt-get install -y nodejs
          rustup toolchain install stable --profile minimal
          sudo apt-get install -y git-lfs

      - name: scaffold verify (the E2E lane probe — tolerates cold lanes)
        run: ./scaffold.sh verify

      - name: cargo test --workspace
        run: PATH="$HOME/.cargo/bin:$PATH" cargo test --workspace

      - name: cargo build --workspace --examples (incl. the dream)
        run: PATH="$HOME/.cargo/bin:$PATH" cargo build --workspace --examples

      - name: checkout the floors' repos (centerfugeq + pocoo)
        uses: actions/checkout@v4
        with:
          repository: peterlodri-sec/centerfugeq
          path: centerfugeq
          lfs: true
      - name: checkout pocoo.vaked.dev
        uses: actions/checkout@v4
        with:
          repository: peterlodri-sec/pocoo.vaked.dev
          path: pocoo.vaked.dev
          lfs: true

      - name: the floors smoke harness (centerfugeq + pocoo copies)
        working-directory: centerfugeq
        run: node scripts/check-floors.mjs quantGame/*.html game/*.html demos/*.html ../pocoo.vaked.dev/demos/centerfugeq/*.html
