<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="8b-is Engine — the chaos overworld">
  <defs>
    <radialGradient id="void" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="55%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4e00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00aa55"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#void)"/>

  <!-- star dust -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="120" cy="80" r="1.2"/><circle cx="340" cy="40" r="0.9"/>
    <circle cx="520" cy="110" r="1.4"/><circle cx="760" cy="55" r="1.0"/>
    <circle cx="980" cy="90" r="1.3"/><circle cx="1240" cy="45" r="0.9"/>
    <circle cx="1420" cy="120" r="1.2"/><circle cx="1560" cy="70" r="1.0"/>
    <circle cx="60" cy="300" r="1.0"/><circle cx="200" cy="420" r="1.3"/>
    <circle cx="460" cy="390" r="0.9"/><circle cx="700" cy="440" r="1.2"/>
    <circle cx="900" cy="400" r="1.0"/><circle cx="1150" cy="430" r="1.4"/>
    <circle cx="1380" cy="380" r="0.9"/><circle cx="1520" cy="440" r="1.2"/>
    <circle cx="80" cy="200" r="0.8"/><circle cx="1490" cy="240" r="1.0"/>
  </g>

  <!-- the mandala: the ternary wire {-1, 0, +1} -->
  <g transform="translate(800,250)">
    <circle r="190" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.35" filter="url(#soft)"/>
    <circle r="160" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5" stroke-dasharray="3 7"/>
    <circle r="130" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.4"/>
    <circle r="96" fill="url(#core)" opacity="0.16" filter="url(#haze)"/>
    <circle r="96" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
    <!-- the triangle at the center -->
    <g stroke="#ffd700" stroke-width="2.5" fill="none" filter="url(#glow)">
      <polygon points="0,-72 62.4,36 -62.4,36"/>
      <polygon points="0,-72 62.4,36 -62.4,36" transform="rotate(180)" opacity="0.35"/>
    </g>
    <circle r="14" fill="#fff3c4" opacity="0.95" filter="url(#glow)"/>
    <!-- the trits -->
    <g font-family="ui-monospace,monospace" font-size="17" fill="#ffd700" opacity="0.9">
      <text x="0" y="-104" text-anchor="middle">+1</text>
      <text x="0" y="122" text-anchor="middle">−1</text>
      <text x="104" y="6" text-anchor="middle">0</text>
    </g>
    <!-- petals -->
    <g fill="none" stroke="#ffd700" stroke-width="1" opacity="0.35">
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(0 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(45 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(90 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(135 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(180 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(225 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(270 0 0)"/>
      <ellipse cx="0" cy="-150" rx="16" ry="34" transform="rotate(315 0 0)"/>
    </g>
  </g>

  <!-- floating polyhedra -->
  <g filter="url(#glow)">
    <!-- tetrahedron, cyan -->
    <g transform="translate(210,170)" stroke="url(#cyan)" stroke-width="2" fill="none" opacity="0.9">
      <polygon points="0,-55 52,20 -52,20"/>
      <polygon points="0,-55 52,20 0,62" opacity="0.5"/>
      <polygon points="0,-55 -52,20 0,62" opacity="0.5"/>
      <polygon points="52,20 -52,20 0,62" opacity="0.25"/>
    </g>
    <!-- cube, magenta -->
    <g transform="translate(1390,150)" stroke="url(#magenta)" stroke-width="2" fill="none" opacity="0.9">
      <rect x="-42" y="-42" width="84" height="84"/>
      <polygon points="-42,-42 0,-84 84,-84 42,-42" opacity="0.6"/>
      <polygon points="42,-42 84,-84 84,0 42,42" opacity="0.6"/>
      <polygon points="-42,42 0,0 84,0 42,42" opacity="0.3"/>
      <polygon points="-42,-42 0,0 0,-84" opacity="0.5"/>
    </g>
    <!-- icosahedron, emerald -->
    <g transform="translate(320,380)" stroke="url(#emerald)" stroke-width="1.8" fill="none" opacity="0.85">
      <polygon points="0,-48 46,15 -46,15"/>
      <polygon points="0,-48 46,15 0,52" opacity="0.5"/>
      <polygon points="0,-48 -46,15 0,52" opacity="0.5"/>
      <polygon points="46,15 0,52 -46,15" opacity="0.3"/>
    </g>
    <!-- small octahedron, cyan -->
    <g transform="translate(1240,360)" stroke="url(#cyan)" stroke-width="1.6" fill="none" opacity="0.8">
      <polygon points="0,-40 34,0 0,40 -34,0"/>
      <polygon points="0,-40 34,0 0,0" opacity="0.5"/>
      <polygon points="0,-40 -34,0 0,0" opacity="0.5"/>
      <polygon points="34,0 0,40 0,0" opacity="0.4"/>
      <polygon points="-34,0 0,40 0,0" opacity="0.4"/>
    </g>
    <!-- tiny tetra, gold -->
    <g transform="translate(560,120)" stroke="#ffd700" stroke-width="1.6" fill="none" opacity="0.8">
      <polygon points="0,-30 28,11 -28,11"/>
      <polygon points="0,-30 28,11 0,30" opacity="0.5"/>
      <polygon points="0,-30 -28,11 0,30" opacity="0.5"/>
    </g>
  </g>

  <!-- drifting ember motes -->
  <g filter="url(#soft)">
    <circle cx="150" cy="260" r="3" fill="#ff007f" opacity="0.7"/>
    <circle cx="420" cy="300" r="2.4" fill="#00f0ff" opacity="0.7"/>
    <circle cx="700" cy="130" r="2.6" fill="#ffd700" opacity="0.8"/>
    <circle cx="950" cy="360" r="2.2" fill="#00ff66" opacity="0.7"/>
    <circle cx="1180" cy="180" r="2.8" fill="#ff007f" opacity="0.7"/>
    <circle cx="1460" cy="300" r="2.4" fill="#00f0ff" opacity="0.7"/>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, monospace">
    <text x="60" y="120" font-size="15" letter-spacing="6" fill="#00f0ff" opacity="0.9">⟦ 8b-is · the chaos overworld ⟧</text>
    <text x="60" y="160" font-size="52" font-weight="700" letter-spacing="4" fill="#e8f0f8">
      8b-is<tspan fill="#ffd700"> ENGINE</tspan>
    </text>
    <text x="62" y="196" font-size="15" letter-spacing="3" fill="#5a7a8a">
      the MMO + game engine · one door, many lanes · coherence without collapse
    </text>
    <text x="60" y="430" font-size="12" letter-spacing="2" fill="#5a7a8a">
      Rust 2024 core · Go 1.26 network · wgpu / Rapier3D / SDF · Luau add-ons · K8s sidecar mesh
    </text>
    <text x="60" y="452" font-size="12" letter-spacing="2" fill="#4a5a6a">
      the ternary wire {-1, 0, +1} · the 108 gates · the sacred bestiary · the deities await
    </text>
  </g>
</svg>
