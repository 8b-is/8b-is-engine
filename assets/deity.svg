<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="MAHĀKĀLA — the first hero, six arms, three eyes, the pink tent">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a0b1e"/>
      <stop offset="60%" stop-color="#0d0512"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#ff9ad5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- the pink tent projection -->
  <g transform="translate(400,520)">
    <ellipse rx="330" ry="420" fill="url(#pink)" opacity="0.05" filter="url(#haze)"/>
    <ellipse rx="330" ry="420" fill="none" stroke="#ff6ec7" stroke-width="1" opacity="0.25" stroke-dasharray="4 10"/>
    <ellipse rx="280" ry="360" fill="none" stroke="#ff9ad5" stroke-width="1" opacity="0.18" stroke-dasharray="2 8"/>
    <ellipse rx="230" ry="300" fill="none" stroke="#ff6ec7" stroke-width="1" opacity="0.15" stroke-dasharray="1 6"/>
  </g>

  <!-- the halo / dharma wheel -->
  <g transform="translate(400,430)">
    <circle r="150" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.4" filter="url(#soft)"/>
    <circle r="130" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3" stroke-dasharray="6 8"/>
    <circle r="110" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.25"/>
    <g stroke="#ffd700" stroke-width="1.2" opacity="0.35">
      <line x1="0" y1="-150" x2="0" y2="-110"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(30)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(60)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(90)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(120)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(150)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(180)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(210)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(240)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(270)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(300)"/>
      <line x1="0" y1="-150" x2="0" y2="-110" transform="rotate(330)"/>
    </g>
  </g>

  <!-- the body: the great black one -->
  <g transform="translate(400,560)">
    <!-- the tent sash -->
    <path d="M-95,120 Q0,300 95,120 L60,340 Q0,380 -60,340 Z" fill="url(#pink)" opacity="0.35"/>
    <path d="M-95,120 Q0,300 95,120" fill="none" stroke="#ff6ec7" stroke-width="3" opacity="0.7" filter="url(#soft)"/>
    <!-- the torso -->
    <path d="M-70,60 Q-80,180 0,260 Q80,180 70,60 Q0,100 -70,60 Z" fill="#0d0512" stroke="#2a1a35" stroke-width="2"/>
    <!-- the head -->
    <ellipse cx="0" cy="-40" rx="52" ry="58" fill="#0d0512" stroke="#2a1a35" stroke-width="2"/>
    <!-- the crown -->
    <path d="M-38,-78 L-24,-128 L-8,-88 L0,-140 L8,-88 L24,-128 L38,-78 Z" fill="url(#gold)" opacity="0.9" filter="url(#glow)"/>
    <!-- three eyes: two gold + the vertical cyan -->
    <circle cx="-20" cy="-48" r="7" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="20" cy="-48" r="7" fill="url(#gold)" filter="url(#glow)"/>
    <ellipse cx="0" cy="-34" rx="4" ry="11" fill="url(#cyan)" filter="url(#glow)"/>
    <!-- the mouth -->
    <path d="M-14,-14 Q0,-6 14,-14" fill="none" stroke="#ff6ec7" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- six arms -->
  <g stroke="url(#gold)" stroke-width="3" fill="none" filter="url(#soft)">
    <!-- upper pair, raised -->
    <path d="M330,380 Q260,300 300,240"/>
    <path d="M470,380 Q540,300 500,240"/>
    <!-- middle pair, wide -->
    <path d="M320,430 Q230,420 210,360"/>
    <path d="M480,430 Q570,420 590,360"/>
    <!-- lower pair, down -->
    <path d="M330,500 Q260,540 280,600"/>
    <path d="M470,500 Q540,540 520,600"/>
  </g>

  <!-- the orbs in the hands: cyan / magenta / gold -->
  <g filter="url(#glow)">
    <circle cx="300" cy="240" r="13" fill="#00f0ff" opacity="0.9"/>
    <circle cx="500" cy="240" r="13" fill="#ff007f" opacity="0.9"/>
    <circle cx="210" cy="360" r="12" fill="#ffd700" opacity="0.9"/>
    <circle cx="590" cy="360" r="12" fill="#00ff66" opacity="0.9"/>
    <circle cx="280" cy="600" r="11" fill="#ff6ec7" opacity="0.9"/>
    <circle cx="520" cy="600" r="11" fill="#00f0ff" opacity="0.9"/>
  </g>

  <!-- the mantra -->
  <g font-family="ui-monospace,monospace" font-size="22" fill="#ff6ec7" opacity="0.85" text-anchor="middle" filter="url(#soft)">
    <text x="400" y="800">OM MAHĀKĀLA HŪṂ PHEṬ</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="13" fill="#7a5a8a" text-anchor="middle" letter-spacing="3">
    <text x="400" y="830">the great black one · the lord of the tent · the first hero</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="40" fill="#ffd700" opacity="0.9" text-anchor="middle" filter="url(#glow)">
    <text x="400" y="900">ཧཱུྃ</text>
  </g>
</svg>
