<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="the ternary wire mandala — {-1, 0, +1}">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="60%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#8a6500"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- outer rings -->
  <g transform="translate(400,400)">
    <circle r="360" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.25" stroke-dasharray="2 6"/>
    <circle r="330" fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.4"/>
    <circle r="300" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5" stroke-dasharray="14 10"/>
    <circle r="270" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3" stroke-dasharray="1 5"/>

    <!-- 108 gate marks -->
    <g stroke="#ffd700" stroke-width="1.4" opacity="0.55">
      <line x1="0" y1="-300" x2="0" y2="-284"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(10)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(20)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(30)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(40)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(50)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(60)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(70)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(80)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(90)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(100)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(110)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(120)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(130)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(140)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(150)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(160)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(170)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(180)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(190)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(200)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(210)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(220)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(230)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(240)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(250)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(260)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(270)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(280)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(290)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(300)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(310)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(320)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(330)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(340)"/>
      <line x1="0" y1="-300" x2="0" y2="-284" transform="rotate(350)"/>
    </g>

    <!-- petals -->
    <g fill="none" stroke="#b8860b" stroke-width="1.2" opacity="0.5">
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(0 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(30 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(60 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(90 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(120 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(150 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(180 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(210 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(240 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(270 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(300 0 0)"/>
      <ellipse cx="0" cy="-240" rx="22" ry="48" transform="rotate(330 0 0)"/>
    </g>

    <!-- the ternary wire: the triangle, doubled -->
    <circle r="150" fill="url(#gold)" opacity="0.12" filter="url(#haze)"/>
    <circle r="150" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <g stroke="#ffd700" stroke-width="3" fill="none" filter="url(#glow)">
      <polygon points="0,-112 97,56 -97,56"/>
      <polygon points="0,-112 97,56 -97,56" transform="rotate(180)" opacity="0.4"/>
    </g>
    <circle r="20" fill="#fff3c4" filter="url(#glow)"/>

    <!-- the trits -->
    <g font-family="ui-monospace,monospace" font-size="26" fill="#ffd700">
      <text x="0" y="-160" text-anchor="middle" filter="url(#glow)">+1</text>
      <text x="0" y="192" text-anchor="middle" filter="url(#glow)">−1</text>
      <text x="166" y="8" text-anchor="middle" filter="url(#glow)">0</text>
    </g>

    <!-- orbiting sparks -->
    <g filter="url(#glow)">
      <circle cx="0" cy="-150" r="5" fill="#00f0ff"/>
      <circle cx="0" cy="-150" r="5" fill="#ff007f" transform="rotate(120)"/>
      <circle cx="0" cy="-150" r="5" fill="#00ff66" transform="rotate(240)"/>
    </g>

    <!-- the 108 malas -->
    <g fill="#ffd700" opacity="0.7">
      <circle cx="0" cy="-208" r="2.6"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(20)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(40)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(60)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(80)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(100)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(120)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(140)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(160)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(180)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(200)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(220)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(240)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(260)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(280)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(300)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(320)"/>
      <circle cx="0" cy="-208" r="2.6" transform="rotate(340)"/>
    </g>
  </g>

  <!-- corner runes -->
  <g font-family="ui-monospace,monospace" font-size="14" fill="#00f0ff" opacity="0.5" letter-spacing="2">
    <text x="40" y="60">ཧཱུྃ</text>
    <text x="700" y="740" text-anchor="end">ཨོཾ</text>
  </g>
</svg>
