<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="the polyhedral sanctuary — the chaos overworld's first demo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#131a30"/>
      <stop offset="100%" stop-color="#1a0b1e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00aa55"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="90" cy="60" r="1.3"/><circle cx="240" cy="110" r="1.0"/>
    <circle cx="420" cy="50" r="1.4"/><circle cx="610" cy="90" r="1.1"/>
    <circle cx="800" cy="40" r="1.3"/><circle cx="980" cy="120" r="1.0"/>
    <circle cx="1100" cy="60" r="1.4"/><circle cx="150" cy="200" r="1.0"/>
    <circle cx="1050" cy="220" r="1.1"/><circle cx="700" cy="160" r="1.2"/>
  </g>

  <!-- the ground plane -->
  <rect x="0" y="620" width="1200" height="180" fill="#0d1322"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#00f0ff" stroke-width="1.5" opacity="0.5" filter="url(#soft)"/>

  <!-- the sanctuary gate (the 108-fold arch) -->
  <g transform="translate(600,300)">
    <path d="M-140,320 L-140,60 Q0,-120 140,60 L140,320 Z" fill="none" stroke="#ffd700" stroke-width="3" opacity="0.9" filter="url(#glow)"/>
    <path d="M-110,320 L-110,80 Q0,-70 110,80 L110,320 Z" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 6"/>
    <!-- the gate's ternary wire -->
    <polygon points="0,-60 52,30 -52,30" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <circle r="8" fill="#fff3c4" filter="url(#glow)"/>
    <!-- the mala count -->
    <g fill="#ffd700" opacity="0.7">
      <circle cx="0" cy="-95" r="2.4"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(30)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(60)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(90)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(120)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(150)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(180)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(210)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(240)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(270)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(300)"/>
      <circle cx="0" cy="-95" r="2.4" transform="rotate(330)"/>
    </g>
  </g>

  <!-- the sacred bestiary -->
  <!-- cube-wolf, cyan -->
  <g transform="translate(240,560)" stroke="url(#cyan)" stroke-width="2.5" fill="none" filter="url(#soft)">
    <rect x="-34" y="-34" width="68" height="68"/>
    <polygon points="-34,-34 0,-68 68,-68 34,-34" opacity="0.6"/>
    <polygon points="34,-34 68,-68 68,0 34,34" opacity="0.6"/>
    <polygon points="-34,34 0,0 68,0 34,34" opacity="0.3"/>
    <circle cx="-10" cy="-12" r="3" fill="#00f0ff" opacity="0.9"/>
    <circle cx="10" cy="-12" r="3" fill="#00f0ff" opacity="0.9"/>
  </g>
  <!-- icosa-owl, magenta -->
  <g transform="translate(940,540)" stroke="url(#magenta)" stroke-width="2.5" fill="none" filter="url(#soft)">
    <polygon points="0,-52 49,16 -49,16"/>
    <polygon points="0,-52 49,16 0,56" opacity="0.5"/>
    <polygon points="0,-52 -49,16 0,56" opacity="0.5"/>
    <polygon points="49,16 0,56 -49,16" opacity="0.3"/>
    <circle cx="-12" cy="-18" r="3.5" fill="#ff007f" opacity="0.9"/>
    <circle cx="12" cy="-18" r="3.5" fill="#ff007f" opacity="0.9"/>
  </g>
  <!-- dodeca-bear, emerald -->
  <g transform="translate(720,570)" stroke="url(#emerald)" stroke-width="2.5" fill="none" filter="url(#soft)">
    <polygon points="0,-46 44,14 -44,14"/>
    <polygon points="0,-46 44,14 0,50" opacity="0.5"/>
    <polygon points="0,-46 -44,14 0,50" opacity="0.5"/>
    <polygon points="44,14 0,50 -44,14" opacity="0.3"/>
    <circle cx="-11" cy="-14" r="3" fill="#00ff66" opacity="0.9"/>
    <circle cx="11" cy="-14" r="3" fill="#00ff66" opacity="0.9"/>
  </g>

  <!-- gold sparkles (the pickups) -->
  <g filter="url(#glow)">
    <circle cx="180" cy="500" r="4" fill="#ffd700"/>
    <circle cx="420" cy="470" r="3.4" fill="#ffd700"/>
    <circle cx="560" cy="520" r="4" fill="#ffd700"/>
    <circle cx="820" cy="480" r="3.4" fill="#ffd700"/>
    <circle cx="1030" cy="470" r="4" fill="#ffd700"/>
  </g>

  <!-- the /say bubble -->
  <g transform="translate(940,470)">
    <rect x="-70" y="-34" width="140" height="28" rx="8" fill="rgba(11,15,25,0.9)" stroke="#ff007f" stroke-width="1" opacity="0.9"/>
    <text x="0" y="-15" font-family="ui-monospace,monospace" font-size="11" fill="#ff9ad5" text-anchor="middle">/say the tent is open</text>
  </g>

  <!-- the zone banner -->
  <g font-family="ui-monospace,monospace">
    <text x="600" y="60" text-anchor="middle" font-size="14" letter-spacing="6" fill="#00f0ff" opacity="0.9">⟦ POLYHEDRAL SANCTUARY · the chaos overworld ⟧</text>
    <text x="600" y="84" text-anchor="middle" font-size="10" letter-spacing="3" fill="#5a7a8a">stomp · split · bounce · the 108 gates await</text>
  </g>

  <!-- floating polyhedra in the sky -->
  <g filter="url(#soft)">
    <g transform="translate(160,300)" stroke="#ffd700" stroke-width="1.6" fill="none" opacity="0.7">
      <polygon points="0,-26 24,9 -24,9"/>
      <polygon points="0,-26 24,9 0,26" opacity="0.5"/>
      <polygon points="0,-26 -24,9 0,26" opacity="0.5"/>
    </g>
    <g transform="translate(1060,290)" stroke="#00f0ff" stroke-width="1.6" fill="none" opacity="0.7">
      <polygon points="0,-26 24,9 -24,9"/>
      <polygon points="0,-26 24,9 0,26" opacity="0.5"/>
      <polygon points="0,-26 -24,9 0,26" opacity="0.5"/>
    </g>
    <g transform="translate(380,240)" stroke="#ff007f" stroke-width="1.6" fill="none" opacity="0.6">
      <polygon points="0,-26 24,9 -24,9"/>
      <polygon points="0,-26 24,9 0,26" opacity="0.5"/>
      <polygon points="0,-26 -24,9 0,26" opacity="0.5"/>
    </g>
  </g>
</svg>
