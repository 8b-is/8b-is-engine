[package]
name = "world-core"
description = "the shared world core: tern + GAIA + the fold — one source of truth, three surfaces (native, WASM, mesh)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
zstd = "0.13"
