<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="bgDark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="60%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#62e6c9"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <linearGradient id="anvilMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="1200" fill="url(#bgDark)"/>

  <!-- Perspective Grid Lines -->
  <g stroke="#1a1f36" stroke-width="1.2" opacity="0.65">
    <line x1="100" y1="1200" x2="600" y2="520"/>
    <line x1="250" y1="1200" x2="600" y2="520"/>
    <line x1="400" y1="1200" x2="600" y2="520"/>
    <line x1="550" y1="1200" x2="600" y2="520"/>
    <line x1="650" y1="1200" x2="600" y2="520"/>
    <line x1="800" y1="1200" x2="600" y2="520"/>
    <line x1="950" y1="1200" x2="600" y2="520"/>
    <line x1="1100" y1="1200" x2="600" y2="520"/>
    <!-- Horizontal floor grid -->
    <line x1="0" y1="1100" x2="1200" y2="1100"/>
    <line x1="0" y1="980" x2="1200" y2="980"/>
    <line x1="0" y1="840" x2="1200" y2="840"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- Gravitational Wave Resonance Rings -->
  <g fill="none" stroke="url(#neonCyan)" opacity="0.25" stroke-width="2" filter="url(#glow)">
    <ellipse cx="600" cy="520" rx="420" ry="140"/>
    <ellipse cx="600" cy="520" rx="320" ry="105"/>
    <ellipse cx="600" cy="520" rx="220" ry="75"/>
    <ellipse cx="600" cy="520" rx="120" ry="40"/>
  </g>

  <!-- Infinite Tension Sound Waveform Spectrum -->
  <g opacity="0.85" filter="url(#glow)">
    <path d="M 150,750 Q 220,710 300,740 T 450,700 T 600,620 T 750,700 T 900,740 T 1050,750" fill="none" stroke="url(#amberGold)" stroke-width="4"/>
    <path d="M 150,750 Q 220,780 300,760 T 450,800 T 600,880 T 750,800 T 900,760 T 1050,750" fill="none" stroke="url(#neonCyan)" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- The Anvil Monolith (Heavy Dystopian Silhouette) -->
  <g filter="url(#subtleGlow)">
    <!-- Base Pillar -->
    <polygon points="520,820 680,820 650,420 550,420" fill="url(#anvilMetal)" stroke="#62e6c9" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Anvil Horn & Top Plate -->
    <polygon points="340,420 860,420 820,340 380,340" fill="url(#anvilMetal)" stroke="#ffd700" stroke-width="2.5" stroke-opacity="0.8"/>
    <!-- Left Horn Extension -->
    <polygon points="380,340 340,420 220,380" fill="url(#anvilMetal)" stroke="#62e6c9" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Top Glowing Energy Core Slot -->
    <rect x="460" y="360" width="280" height="18" rx="4" fill="url(#neonCyan)" filter="url(#glow)"/>
  </g>

  <!-- Harmonic 42+1+<3 Layer Sparks -->
  <g fill="#62e6c9" opacity="0.7">
    <circle cx="360" cy="310" r="3" filter="url(#glow)"/>
    <circle cx="840" cy="310" r="4" filter="url(#glow)"/>
    <circle cx="600" cy="260" r="5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="480" cy="220" r="3"/>
    <circle cx="720" cy="200" r="3.5"/>
    <circle cx="280" cy="500" r="2.5"/>
    <circle cx="920" cy="500" r="2.5"/>
  </g>

  <!-- Typography & Badges -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">
    <!-- Top Series Stamp -->
    <text x="600" y="110" font-size="16" letter-spacing="8" fill="#a59fc4" opacity="0.75">VAKED CONSTELLATION · SOVEREIGN AUDIO</text>
    <text x="600" y="145" font-size="28" letter-spacing="12" font-weight="700" fill="url(#neonCyan)" filter="url(#subtleGlow)">42 + 1 + &lt;3 LAYERS</text>
    
    <!-- Center Sub-label -->
    <text x="600" y="470" font-size="13" letter-spacing="6" fill="#ffd700" font-weight="bold">INFINITE TENSION · NEVER DROPS</text>
    
    <!-- Title Block -->
    <text x="600" y="980" font-size="52" font-weight="800" letter-spacing="14" fill="#ffffff">ANVIL</text>
    <text x="600" y="1025" font-size="18" font-weight="600" letter-spacing="8" fill="url(#amberGold)">LORN × DEEP HOUSE (SUSPENDED)</text>
    <text x="600" y="1065" font-size="13" letter-spacing="5" fill="#62e6c9" opacity="0.85">432Hz HARMONIC SYNTHESIS · 24-BIT PCM WAV</text>
    <text x="600" y="1120" font-size="12" letter-spacing="6" fill="#7f7c99">PRODUCED BY PÉTER LODRI · AGPL-3.0</text>
  </g>
</svg>
